{% extends "base.html" %}
{% block title %}Éditer la tâche{% endblock %}

{% block content %}
<div class="bal-breadcrumb">
    <a href="{{ url_for('index') }}">Accueil</a><span class="sep">/</span>
    <a href="{{ url_for('projet_dashboard', projet_id=tache.projet_id) }}">{{ tache.projet.nom }}</a><span class="sep">/</span>
    <a href="{{ url_for('toutes_les_taches', projet_id=tache.projet_id) }}">Tâches</a><span class="sep">/</span>
    Éditer
</div>
<div class="bal-page-header">
    <h1>Éditer la tâche</h1>
</div>

<div style="max-width:560px;">
<div class="bal-card">
    <form method="POST" action="{{ url_for('editer_tache', tache_id=tache.id) }}">
        <input type="hidden" name="retour" value="{{ retour }}">
        <div class="bal-form-group">
            <label class="bal-label">Description *</label>
            <textarea class="bal-form-control" name="description" rows="3" required>{{ tache.description }}</textarea>
        </div>
        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label class="bal-label">Statut</label>
                <select class="bal-form-control" name="statut">
                    <option value="à faire" {% if tache.statut == 'à faire' %}selected{% endif %}>À faire</option>
                    <option value="en cours" {% if tache.statut == 'en cours' %}selected{% endif %}>En cours</option>
                    <option value="en attente" {% if tache.statut == 'en attente' %}selected{% endif %}>En attente</option>
                    <option value="terminé" {% if tache.statut == 'terminé' %}selected{% endif %}>Terminé</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="bal-label">Date limite</label>
                <input type="date" class="bal-form-control" name="date_limite"
                       value="{{ tache.date_limite.strftime('%Y-%m-%d') if tache.date_limite else '' }}">
            </div>
        </div>
        <div class="bal-form-group">
            <label class="bal-label">Priorité (matrice Eisenhower)</label>
            <div class="d-flex gap-2 flex-wrap">
                {% for p in PRIORITES_TACHE %}
                <label class="priorite-badge priorite-{{ p }}" style="cursor:pointer;border:2px solid transparent;{% if tache.priorite == p %}border-color:currentColor;{% endif %}">
                    <input type="radio" name="priorite" value="{{ p }}" {% if tache.priorite == p %}checked{% endif %} style="margin-right:0.3rem;">
                    {{ PRIORITES_LABELS[p] }}
                </label>
                {% endfor %}
            </div>
        </div>
        <div class="d-flex gap-2 mt-3">
            <button type="submit" class="btn-bal"><i class="bi bi-check-lg"></i> Enregistrer</button>
            <a href="{{ retour or url_for('toutes_les_taches', projet_id=tache.projet_id) }}" class="btn-bal-ghost">Annuler</a>
        </div>
    </form>
</div>
</div>
{% endblock %}
