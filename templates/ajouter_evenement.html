{% extends "base.html" %}
{% block title %}Ajouter un événement — {{ projet.nom }}{% endblock %}

{% block content %}
<div class="bal-breadcrumb">
    <a href="{{ url_for('index') }}">Accueil</a><span class="sep">/</span>
    <a href="{{ url_for('projet_dashboard', projet_id=projet.id) }}">{{ projet.nom }}</a><span class="sep">/</span>
    <a href="{{ url_for('evenements', projet_id=projet.id) }}">Événements</a><span class="sep">/</span>
    Ajouter
</div>
<div class="bal-page-header">
    <h1>Ajouter un événement</h1>
</div>

<div style="max-width:700px;">
<div class="bal-card">
    <form method="POST" action="{{ url_for('ajouter_evenement', projet_id=projet.id) }}" id="form-evenement">
        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label class="bal-label">Type *</label>
                <input type="text" class="bal-form-control" name="type" list="types-list" required placeholder="note, réunion, communication…">
                <datalist id="types-list">
                    <option value="note"><option value="réunion"><option value="communication">
                    <option value="envoyé"><option value="reçu"><option value="autre">
                </datalist>
            </div>
            <div class="col-md-6">
                <label class="bal-label">Date et heure *</label>
                <input type="datetime-local" class="bal-form-control" name="date" required
                       value="{{ datetime.utcnow().strftime('%Y-%m-%dT%H:%M') }}">
            </div>
        </div>
        <div class="bal-form-group">
            <label class="bal-label">Contenu *</label>
            <textarea class="bal-form-control" name="contenu" rows="5" required></textarea>
        </div>

        <!-- Tâches associées -->
        <div class="mt-3">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <label class="bal-label mb-0">Tâches associées</label>
                <button type="button" class="btn-bal-outline" onclick="ajouterLigneTache()" style="font-size:0.82rem;padding:0.25rem 0.7rem;">
                    <i class="bi bi-plus"></i> Ajouter une tâche
                </button>
            </div>
            <div id="taches-container"></div>
        </div>

        <div class="d-flex gap-2 mt-4">
            <button type="submit" name="action" value="sauvegarder" class="btn-bal"><i class="bi bi-check-lg"></i> Enregistrer</button>
            <button type="submit" name="action" value="ajouter_fichiers" class="btn-bal-outline"><i class="bi bi-paperclip"></i> Enregistrer et ajouter des fichiers</button>
            <a href="{{ url_for('evenements', projet_id=projet.id) }}" class="btn-bal-ghost">Annuler</a>
        </div>
    </form>
</div>
</div>

<script>
function ajouterLigneTache() {
    const container = document.getElementById('taches-container');
    const idx = container.children.length;
    const div = document.createElement('div');
    div.className = 'd-flex gap-2 mb-2 align-items-center';
    div.innerHTML = `
        <input type="text" class="bal-form-control" name="taches[]" placeholder="Description de la tâche" style="flex:1;">
        <input type="date" class="bal-form-control" name="date_limite[]" style="width:150px;">
        <select class="bal-form-control" name="statuts[]" style="width:130px;">
            <option value="à faire">À faire</option>
            <option value="en cours">En cours</option>
            <option value="en attente">En attente</option>
        </select>
        <button type="button" onclick="this.parentElement.remove()" class="btn-bal-danger" style="padding:0.3rem 0.6rem;flex-shrink:0;"><i class="bi bi-x"></i></button>
    `;
    container.appendChild(div);
}
</script>
{% endblock %}
