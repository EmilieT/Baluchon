{% extends "base.html" %}
{% block title %}Modifier l'événement{% endblock %}

{% block content %}
<div class="bal-breadcrumb">
    <a href="{{ url_for('index') }}">Accueil</a><span class="sep">/</span>
    <a href="{{ url_for('projet_dashboard', projet_id=evenement.projet_id) }}">{{ evenement.projet.nom }}</a><span class="sep">/</span>
    <a href="{{ url_for('evenements', projet_id=evenement.projet_id) }}">Événements</a><span class="sep">/</span>
    Modifier
</div>
<div class="bal-page-header">
    <h1>Modifier l'événement</h1>
</div>

<div style="max-width:700px;">
<div class="bal-card">
    <form method="POST" action="{{ url_for('modifier_evenement', evenement_id=evenement.id) }}">
        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label class="bal-label">Type *</label>
                <input type="text" class="bal-form-control" name="type" list="types-list" value="{{ evenement.type }}" required>
                <datalist id="types-list">
                    <option value="note"><option value="réunion"><option value="communication">
                    <option value="envoyé"><option value="reçu"><option value="autre">
                </datalist>
            </div>
            <div class="col-md-6">
                <label class="bal-label">Date et heure *</label>
                <input type="datetime-local" class="bal-form-control" name="date"
                       value="{{ evenement.date.strftime('%Y-%m-%dT%H:%M') }}" required>
            </div>
        </div>
        <div class="bal-form-group">
            <label class="bal-label">Contenu *</label>
            <textarea class="bal-form-control" name="contenu" rows="5" required>{{ evenement.contenu }}</textarea>
        </div>

        <!-- Tâches associées -->
        <div class="mt-3">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <label class="bal-label mb-0">Tâches associées</label>
                <button type="button" class="btn-bal-outline" onclick="ajouterLigneTache()" style="font-size:0.82rem;padding:0.25rem 0.7rem;">
                    <i class="bi bi-plus"></i> Ajouter
                </button>
            </div>
            <div id="taches-container">
                {% for t in evenement.taches %}
                <div class="d-flex gap-2 mb-2 align-items-center">
                    <input type="text" class="bal-form-control" name="taches[]" value="{{ t.description }}" style="flex:1;">
                    <input type="date" class="bal-form-control" name="date_limite[]"
                           value="{{ t.date_limite.strftime('%Y-%m-%d') if t.date_limite else '' }}" style="width:150px;">
                    <button type="button" onclick="this.parentElement.remove()" class="btn-bal-danger" style="padding:0.3rem 0.6rem;flex-shrink:0;"><i class="bi bi-x"></i></button>
                </div>
                {% endfor %}
            </div>
        </div>

        <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn-bal"><i class="bi bi-check-lg"></i> Enregistrer</button>
            <a href="{{ url_for('evenement_detail', evenement_id=evenement.id) }}" class="btn-bal-ghost">Annuler</a>
        </div>
    </form>
</div>
</div>

<script>
function ajouterLigneTache() {
    const container = document.getElementById('taches-container');
    const div = document.createElement('div');
    div.className = 'd-flex gap-2 mb-2 align-items-center';
    div.innerHTML = `
        <input type="text" class="bal-form-control" name="taches[]" placeholder="Description…" style="flex:1;">
        <input type="date" class="bal-form-control" name="date_limite[]" style="width:150px;">
        <button type="button" onclick="this.parentElement.remove()" class="btn-bal-danger" style="padding:0.3rem 0.6rem;flex-shrink:0;"><i class="bi bi-x"></i></button>
    `;
    container.appendChild(div);
}
</script>
{% endblock %}
