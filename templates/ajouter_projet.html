{% extends "base.html" %}
{% block title %}Nouveau projet{% endblock %}
{% block content %}
<div class="bal-breadcrumb">
    <a href="{{ url_for('index') }}">Accueil</a><span class="sep">/</span>
    <a href="{{ url_for('tous_les_projets') }}">Projets</a><span class="sep">/</span>
    Nouveau projet
</div>
<div class="bal-page-header">
    <h1>Nouveau projet</h1>
</div>
<div style="max-width:600px;">
<div class="bal-card">
    <form method="POST" action="{{ url_for('ajouter_projet') }}">
        <div class="bal-form-group">
            <label class="bal-label" for="nom">Nom du projet *</label>
            <input type="text" class="bal-form-control" id="nom" name="nom" required autofocus>
        </div>
        <div class="bal-form-group">
            <label class="bal-label" for="chemin_rproj">Chemin vers le fichier .Rproj</label>
            <input type="text" class="bal-form-control" id="chemin_rproj" name="chemin_rproj" placeholder="/chemin/vers/projet.Rproj">
        </div>
        <div class="bal-form-group">
            <label class="bal-label" for="statut">Statut</label>
            <select class="bal-form-control" id="statut" name="statut">
                {% for s in STATUTS_PROJET %}
                <option value="{{ s }}" {% if s == 'en cours' %}selected{% endif %}>{{ s|capitalize }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="bal-form-group">
            <label class="bal-label" for="description">Description</label>
            <textarea class="bal-form-control" id="description" name="description" rows="4"></textarea>
        </div>
        <div class="d-flex gap-2 mt-3">
            <button type="submit" class="btn-bal"><i class="bi bi-check-lg"></i> Créer le projet</button>
            <a href="{{ url_for('tous_les_projets') }}" class="btn-bal-ghost">Annuler</a>
        </div>
    </form>
</div>
</div>
{% endblock %}
